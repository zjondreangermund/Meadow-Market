<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meadow Market · Farm Alpha</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@500;600;700&display=swap');
:root{--green:#244b39;--cream:#f6f4eb;--gold:#edc877;--muted:#788276}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#24372c;font-family:'DM Sans',sans-serif}button{cursor:pointer;font:inherit;border:0}button:disabled{opacity:.45;cursor:not-allowed}header{height:86px;background:#fffdf6;border-bottom:1px solid #dedfd4;display:flex;align-items:center;justify-content:space-between;padding:0 4vw}.brand{font:600 27px Fraunces,Georgia;display:flex;gap:12px;align-items:center}.brand span{background:var(--green);color:#fff;border-radius:12px;padding:8px}.pill{border:1px solid #dfe3d6;border-radius:30px;padding:10px 16px;font-size:13px;background:#fff}.alpha{background:#eef0de;color:#63723e}.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 86px)}aside{padding:30px 18px;border-right:1px solid #dedfd4}nav button{display:block;width:100%;text-align:left;background:none;padding:14px 17px;margin:5px 0;border-radius:9px;color:#68756c}nav button.active{background:var(--green);color:white}.sidefoot{font-size:12px;color:#7c8578;margin:70px 16px;line-height:1.8}main{padding:32px 36px;max-width:1600px}.eyebrow{font-size:11px;letter-spacing:2px;color:#8b947e;font-weight:700}h1{font:600 38px Fraunces,Georgia;margin:7px 0}h2{font:600 23px Fraunces,Georgia;margin:0 0 10px}p{color:#7b8478;font-size:14px;line-height:1.6}.heading{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.btn{background:var(--green);color:white;border-radius:8px;padding:12px 18px}.light{background:#e9eddf;color:var(--green)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.stat,.card{background:#fffdf8;border:1px solid #e1e3d8;border-radius:13px;padding:20px}.stat small{color:#85907f}.stat strong{display:block;font-size:25px;margin-top:10px}.columns{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px}.farm{position:relative;border-radius:15px;overflow:hidden;min-height:440px;background:#b6cb8c;border:7px solid #fffdf6}.farm svg{width:100%;height:440px;display:block}.farm-label{position:absolute;top:15px;left:18px;background:#fffdf2e8;border-radius:8px;padding:10px 14px;font-size:12px}.farm-actions{position:absolute;bottom:16px;left:16px;right:16px;display:flex;gap:8px;justify-content:center}.farm-actions button{background:#fffef3;padding:11px 14px;border-radius:8px;box-shadow:0 3px 0 #4e663c30;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 0}.tag{font-size:11px;color:#7b865b;background:#eef1df;padding:5px 8px;border-radius:5px}.bar{height:7px;background:#eceddf;border-radius:5px;margin:9px 0 15px;overflow:hidden}.bar i{display:block;background:#c1a55e;height:100%}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.animal{font-size:60px;background:#edf0df;text-align:center;padding:18px;border-radius:9px;margin-bottom:18px}.detail{font-size:13px;line-height:1.9;color:#7b8478}.note{padding:13px 16px;background:#ebeede;border-radius:9px;font-size:12px;line-height:1.7;margin:18px 0;color:#697850}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:15px 8px;border-bottom:1px solid #e6e8dd}th{color:#8a9381;font-size:11px;text-transform:uppercase}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#244b39;color:#fff;padding:15px 24px;border-radius:10px;z-index:20;display:none;max-width:90vw}.race-track{height:180px;background:#d8ddbc;border:14px solid #bba682;border-radius:100px;position:relative;margin:25px 0}.runner{position:absolute;top:45px;font-size:50px;left:5%;transition:left 2s ease-in-out}.small{font-size:12px}.gold{background:var(--gold);color:#5d4b23}.section{margin-top:24px}select{font:inherit;padding:10px;border:1px solid #dfe3d6;border-radius:7px;background:white}footer{margin-top:25px;color:#919987;font-size:11px} @media(max-width:1000px){.columns{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}main{padding:24px}.layout{grid-template-columns:165px 1fr}}@media(max-width:650px){header{height:70px;padding:0 15px}.brand{font-size:21px}.layout{display:block}aside{padding:8px;border:0;position:sticky;top:0;background:#fffdf6;z-index:10}nav{display:flex;overflow:auto}nav button{white-space:nowrap;padding:10px;width:auto;margin:0}.sidefoot{display:none}main{padding:22px 14px}.heading{align-items:flex-start}h1{font-size:29px}.stats{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:14px}.grid{grid-template-columns:1fr}.farm{min-height:340px}.farm svg{height:340px}.farm-actions button{padding:9px;font-size:11px}.heading .pill{display:none}.card{padding:17px}table{font-size:11px}td .btn{padding:8px}.alpha{font-size:10px;padding:7px}}
</style><header><div class="brand"><span>♧</span> Meadow Market</div><div class="pill alpha">PRIVATE ALPHA · TEST MONEY</div></header><div class="layout"><aside><nav id="nav"></nav><div class="sidefoot">YOUR LITTLE WORLD<br>Grow something good.<br><br>Prototype v0.1<br>Progress saved on this browser.<br>No real money or live traders.</div></aside><main id="app"></main></div><div id="toast" role="status"></div><script>
const key='meadow-alpha-v1';const init=()=>({coins:800,cash:0,reserve:350,feed:30,water:30,day:1,inventory:{eggs:0,milk:0,fertiliser:0},animals:[{id:1,type:'chicken',name:'Amber layers',emoji:'🐔',product:'eggs',yield:6,base:50,fed:false,cycles:0},{id:2,type:'chicken',name:'Speckled hens',emoji:'🐓',product:'eggs',yield:4,base:60,fed:false,cycles:0},{id:3,type:'cow',name:'Daisy',emoji:'🐄',product:'milk',yield:8,base:140,fed:false,cycles:0},{id:4,type:'pig',name:'Clover',emoji:'🐖',product:'fertiliser',yield:3,base:100,fed:false,cycles:0}],horses:[{id:5,name:'Desert Dawn',sex:'Mare',breeds:2,races:0,trained:false},{id:6,name:'Copper Wind',sex:'Stallion',breeds:2,races:0,trained:false}],permits:1,pool:200,logs:[],contracts:0});let s;try{s=JSON.parse(localStorage.getItem(key))||init()}catch{s=init()}let page='Farm',busy=false;const money=n=>'N$'+n.toFixed(2);function save(){localStorage.setItem(key,JSON.stringify(s))}function msg(t){let e=document.querySelector('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3500)}function log(t){s.logs.unshift({day:s.day,text:t});s.logs=s.logs.slice(0,30)}function act(fn){fn();save();render()}const navs=['Farm','Animals','Stables','Market','Wallet','Economy'];function setPage(p){page=p;render()}
function scene(){return `<div class="farm"><div class="farm-label">☀ SUNNY MEADOWS <b> · Day ${s.day}</b></div><svg viewBox="0 0 800 460" aria-label="Illustrated interactive farm with barn, animal paddocks and crop fields"><defs><pattern id="grass" width="34" height="30" patternUnits="userSpaceOnUse"><path d="M5 20l2-5 2 5M25 7l2-4" stroke="#9dbb77" stroke-width="2" fill="none"/></pattern><g id="tree"><rect x="-5" y="10" width="10" height="40" fill="#8d704a"/><circle cy="-5" r="28" fill="#729553"/><circle cx="-17" cy="4" r="22" fill="#81a45e"/><circle cx="13" cy="-15" r="20" fill="#91af67"/></g><g id="fence"><path d="M0 0v35m40-35v35m40-35v35M0 10h80M0 25h80" stroke="#e6cf9e" stroke-width="6"/></g></defs><rect width="800" height="460" fill="#b8ce92"/><rect width="800" height="460" fill="url(#grass)"/><path d="M-20 350Q180 270 380 300T820 200M390 470Q440 350 420 260T500 20" fill="none" stroke="#d8c89e" stroke-width="65"/><path d="M-20 350Q180 270 380 300T820 200" fill="none" stroke="#e5d4ad" stroke-width="44"/><g transform="translate(260 72)"><path d="M0 70L100 15l100 55v110H0" fill="#c97658"/><path d="M-15 70L100-3 215 70l-14 15L100 25 0 85" fill="#905544"/><path d="M78 180v-83h48v83" fill="#654f3c"/><path d="M5 100h55v40H5" fill="#ecd8ac"/><path d="M144 100h45v40h-45" fill="#ecd8ac"/><path d="M100 111v69M80 111l44 68m0-68l-44 68" stroke="#f2ddb4" stroke-width="4"/></g><g transform="translate(75 205)"><use href="#fence"/><use href="#fence" x="80"/><use href="#fence" y="90"/><use href="#fence" x="80" y="90"/><text x="20" y="65" font-size="53">🐄</text><text x="100" y="75" font-size="40">🐖</text></g><g transform="translate(535 135)"><rect width="94" height="65" y="30" fill="#d1a56c"/><path d="M-12 35L45-5l62 40" fill="#a65c43"/><rect x="35" y="60" width="28" height="35" fill="#715538"/><text x="-30" y="112" font-size="38">🐔</text><text x="85" y="112" font-size="34">🐓</text></g><g transform="translate(480 320)"><rect width="205" height="100" rx="9" fill="#9e8053"/>${Array.from({length:24},(_,i)=>`<text x="${10+i%8*24}" y="${29+Math.floor(i/8)*29}" font-size="24">🌱</text>`).join('')}</g><g transform="translate(110 350)"><rect width="105" height="65" fill="#d8c196"/><path d="M-10 0l60-35 65 35" fill="#6f8972"/><text x="30" y="45" font-size="32">🌾</text></g><use href="#tree" x="65" y="75"/><use href="#tree" x="720" y="95"/><use href="#tree" x="740" y="355"/><use href="#tree" x="45" y="415"/><use href="#tree" x="650" y="45"/></svg><div class="farm-actions"><button onclick="feedAll()">🌾 Feed & water</button><button onclick="advance()">☀ Next farm day</button><button onclick="setPage('Market')">🧺 Visit market</button></div></div>`}
function heading(title,sub){return `<div class="heading"><div><div class="eyebrow">MEADOW MARKET / ${page.toUpperCase()}</div><h1>${title}</h1><p>${sub}</p></div><span class="pill">🌤 Day ${s.day} · Spring</span></div>`}function stats(){return `<div class="stats"><div class="stat"><small>Farm coins · non-cash</small><strong>◉ ${s.coins}</strong></div><div class="stat"><small>Simulated cash balance</small><strong>${money(s.cash)}</strong></div><div class="stat"><small>Feed / water</small><strong>${s.feed} / ${s.water}</strong></div><div class="stat"><small>Active farm animals</small><strong>${s.animals.length}</strong></div></div>`}function feedAll(){act(()=>{let a=s.animals.filter(a=>!a.fed&&a.cycles<20);if(!a.length)return msg('All active animals are already cared for.');if(s.feed<a.length||s.water<a.length)return msg('Buy feed and water at the market.');s.feed-=a.length;s.water-=a.length;a.forEach(a=>a.fed=true);log('Fed and watered '+a.length+' animals.');msg('Animals cared for. Advance a day to collect production.');})}function advance(){act(()=>{let count=0;s.animals.forEach(a=>{if(a.fed&&a.cycles<20){s.inventory[a.product]+=a.yield;a.cycles++;a.fed=false;count++}});s.day++;log('Day advanced: '+count+' animals produced goods.');msg(count?'Production collected into your inventory.':'A quiet day. Feed animals before advancing.');})}
function animalCards(){return s.animals.map(a=>`<div class="card"><div class="animal">${a.emoji}</div><div class="row"><h2>${a.name}</h2><span class="tag">${a.cycles>=20?'Retired':a.fed?'Cared for':'Needs care'}</span></div><div class="detail">Produces ${a.yield} ${a.product} / active day<br>Production life: ${a.cycles}/20 cycles<br>Protected test surrender value: ${money(a.base)}</div><div class="bar"><i style="width:${a.cycles/20*100}%"></i></div><button class="btn light" onclick="surrender(${a.id})">Surrender · ${money(a.base)}</button></div>`).join('')}function surrender(id){if(!confirm('Permanently remove this animal and transfer its protected TEST value to your simulated wallet?'))return;act(()=>{let a=s.animals.find(a=>a.id===id);if(!a)return;s.reserve-=a.base;s.cash+=a.base;s.animals=s.animals.filter(a=>a.id!==id);log(a.name+' surrendered for '+money(a.base)+' test cash.');msg('Animal removed. Backing transferred; total liabilities unchanged.');})}
function market(){return `<div class="note">Simulation market: purchases use non-withdrawable farm coins. Contract payments use a finite, pre-funded test pool. No live players or real trades.</div><div class="grid">${[['Feed sack','🌾','10 feed',50,'feed'],['Water delivery','💧','10 water',25,'water']].map(([n,e,d,p,k])=>`<div class="card"><div class="animal">${e}</div><h2>${n}</h2><p>${d}</p><button class="btn" onclick="buy('${k}',${p})">Buy · ${p} coins</button></div>`).join('')}<div class="card"><div class="animal">🧺</div><h2>Your produce</h2><p>🥚 ${s.inventory.eggs} eggs<br>🥛 ${s.inventory.milk} milk<br>🌿 ${s.inventory.fertiliser} fertiliser</p></div></div><div class="card section"><h2>Town delivery contracts</h2><p>Each delivery pays exactly the displayed test amount. Orders stop when the funded pool is exhausted.</p><table><tr><th>Order</th><th>Required</th><th>Test payout</th><th></th></tr>${[['Bakery breakfast','eggs',10,2],['Village dairy','milk',8,3],['Garden co-op','fertiliser',6,1]].map(([n,k,q,p])=>`<tr><td>${n}</td><td>${q} ${k}</td><td>${money(p)}</td><td><button class="btn light" ${s.inventory[k]<q||s.pool<p?'disabled':''} onclick="deliver('${k}',${q},${p})">Deliver</button></td></tr>`).join('')}</table><p>Remaining funded test pool: <b>${money(s.pool)}</b></p></div>`}function buy(k,p){act(()=>{if(s.coins<p)return msg('Not enough farm coins.');s.coins-=p;s[k]+=10;log('Purchased '+k+' for '+p+' farm coins.');})}function deliver(k,q,p){act(()=>{if(s.inventory[k]<q||s.pool<p)return;s.inventory[k]-=q;s.pool-=p;s.cash+=p;s.contracts++;log('Delivered '+q+' '+k+' for '+money(p)+' test cash.');msg('Delivery accepted. Reserved contract funds transferred to your wallet.');})}
function stable(){return `<div class="note">Free practice races only. Horses have no cash surrender guarantee. Breeding consumes a limited permit; new foals create no cash-backed liability.</div><div class="grid">${s.horses.map(h=>`<div class="card"><div class="animal">🐎</div><h2>${h.name}</h2><div class="detail">${h.sex} · ${h.races>=10?'Retired racer':'Active racer'}<br>Race starts: ${h.races}/10<br>Breeding uses remaining: ${h.breeds}<br>Training: ${h.trained?'Ready':'Needed'}</div><button class="btn light" ${h.races>=10?'disabled':''} onclick="train(${h.id})">Train · 10 coins</button></div>`).join('')}</div><div class="card section"><h2>The meadow circuit</h2><p>A free practice race. No wagers, entry fees or cash prizes.</p><div class="race-track"><span class="runner" id="runner">🐎</span></div><button class="btn" id="racebtn" onclick="race()">Run practice race</button><span id="raceresult" class="detail"></span></div><div class="card section"><h2>Controlled breeding</h2><p>Pair Desert Dawn and Copper Wind. Requires training, both breeding allowances, one permit and a stable population below 8. Produces an unprotected foal; it cannot breed in this alpha.</p><button class="btn gold" onclick="breed()">Breed pair · ${s.permits} permit available</button></div>`}function train(id){act(()=>{let h=s.horses.find(h=>h.id===id);if(h.trained)return msg('Already trained.');if(s.coins<10)return msg('Not enough farm coins.');s.coins-=10;h.trained=true;msg('Training complete.');})}function race(){if(busy)return;let h=s.horses.find(h=>h.trained&&h.races<10);if(!h)return msg('Train an eligible horse first.');busy=true;document.querySelector('#racebtn').disabled=true;document.querySelector('#runner').style.left='78%';setTimeout(()=>{h.races++;h.trained=false;log(h.name+' completed a practice race. No cash prize.');save();busy=false;render();document.querySelector('#raceresult').textContent=' '+h.name+' finished! '+(10-h.races)+' race starts remain.'},2200)}function breed(){act(()=>{let [a,b]=s.horses;if(!a||!b||!a.trained||!b.trained||a.breeds<1||b.breeds<1||s.permits<1||s.horses.length>=8)return msg('Train both parents and check permits, breeding limits and stable capacity.');a.breeds--;b.breeds--;a.trained=b.trained=false;s.permits--;s.horses.push({id:Date.now(),name:'Meadow Foal',sex:'Young · no breeding',breeds:0,races:0,trained:false});log('One unprotected foal born. Permit consumed; no cash guarantee created.');msg('Welcome, Meadow Foal! Population controls applied.');})}
function render(){document.querySelector('#nav').innerHTML=navs.map((n,i)=>`<button class="${page===n?'active':''}" onclick="setPage('${n}')">${['⌂','♧','♞','▤','◈','◴'][i]} &nbsp;${n}</button>`).join('');let content='';if(page==='Farm')content=heading('A good day to grow.','Care for your animals, fill a basket, and find your next opportunity.')+stats()+`<div class="columns"><div>${scene()}<div class="note">A working local alpha · feed animals → advance a day → deliver produce. Cash values are simulations only.</div></div><div><div class="card"><div class="eyebrow">TODAY ON THE FARM</div><h2 style="margin-top:12px">Little tasks. Big plans.</h2><div class="row"><span>🌾 Animal care</span><span class="tag">${s.animals.filter(a=>a.fed).length}/${s.animals.length}</span></div><div class="bar"><i style="width:${s.animals.length?s.animals.filter(a=>a.fed).length/s.animals.length*100:0}%"></i></div><div class="row"><span>🧺 Deliveries completed</span><b>${s.contracts}</b></div><button class="btn" style="width:100%" onclick="setPage('Market')">View town orders →</button></div><div class="card section"><div class="eyebrow">FROM YOUR BASKET</div><div class="row"><span>🥚 Fresh eggs</span><b>${s.inventory.eggs}</b></div><div class="row"><span>🥛 Milk</span><b>${s.inventory.milk}</b></div><div class="row"><span>🌿 Fertiliser</span><b>${s.inventory.fertiliser}</b></div></div></div></div>`;
if(page==='Animals')content=heading('Meet your farmhands.','Different animals, connected production chains, protected test base values.')+`<div class="heading"><button class="btn" onclick="feedAll()">Feed all animals</button><button class="btn light" onclick="advance()">Advance farm day</button></div><div class="grid">${animalCards()||'<div class="card">All animals surrendered. Reset the alpha in Economy to start again.</div>'}</div>`;
if(page==='Market')content=heading('From farm to market.','Turn a day’s work into ingredients, supplies and completed orders.')+market();if(page==='Stables')content=heading('Raise a little champion.','Train, race and breed within a limited population.')+stable();if(page==='Wallet')content=heading('Every coin accounted for.','Simulated balances for testing. No deposits, cash withdrawals or payment provider connected.')+stats()+`<div class="card"><h2>Cash-out is not enabled</h2><p>Your ${money(s.cash)} balance is test money with no monetary value. No real funds have been collected.</p><button class="btn light" disabled>Withdrawals unavailable in alpha</button></div><div class="card section"><h2>Activity ledger</h2>${s.logs.length?'<table><tr><th>Farm day</th><th>Activity</th></tr>'+s.logs.map(l=>`<tr><td>${l.day}</td><td>${l.text}</td></tr>`).join('')+'</table>':'<p>Your farm activity will appear here.</p>'}</div>`;
if(page==='Economy'){let total=s.reserve+s.cash+s.pool;content=heading('A farm built to last.','Transparent simulation accounting and controlled asset issuance.')+`<div class="stats"><div class="stat"><small>Animal backing</small><strong>${money(s.reserve)}</strong></div><div class="stat"><small>Player cash liability</small><strong>${money(s.cash)}</strong></div><div class="stat"><small>Contract commitments</small><strong>${money(s.pool)}</strong></div><div class="stat"><small>Total test backing</small><strong>${money(total)}</strong></div></div><div class="card"><h2>Backing invariant</h2><p>Initial test funding is N$550: N$350 for animals and N$200 for contracts. Surrender and deliveries transfer backing into the player wallet; they do not create new money.</p><span class="tag">${Math.abs(total-550)<.001?'✓ Reconciled · N$550.00':'Reconciliation needs attention'}</span><div class="note">These are illustrative ledgers in browser storage, not bank reserves or production accounting. There is no authentication, shared market or server authority yet.</div></div><div class="grid section"><div class="card"><h2>Animal lifecycle</h2><p>20 active production cycles, then retirement. Time away does not reduce the protected test base value.</p></div><div class="card"><h2>Horse population</h2><p>One breeding permit, two uses per parent and eight stable spaces. Breeding adds no protected cash claim.</p></div><div class="card"><h2>Before cash launch</h2><p>Server-side ledger, identity checks, payment acceptance, legal classification, cash reserves and economic stress tests are required.</p></div></div><button class="btn light section" onclick="reset()">Reset this browser’s alpha</button>`}document.querySelector('#app').innerHTML=content+'<footer>MEADOW MARKET · Working title · Private gameplay alpha · All monetary values are simulated</footer>'}function reset(){if(confirm('Reset all local test progress?')){s=init();save();render();msg('Fresh farm ready.')}}render();
</script></html>
